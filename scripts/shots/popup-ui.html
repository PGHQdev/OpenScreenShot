<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <title>popup UI</title>
    <link rel="stylesheet" href="../../src/popup/popup.css" />
    <style>
      body {
        width: 340px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 128 128">
              <rect x="6" y="6" width="116" height="116" rx="30" fill="#FAFAF7" />
              <rect
                x="7.5"
                y="7.5"
                width="113"
                height="113"
                rx="28.5"
                fill="none"
                stroke="#1B1A17"
                stroke-width="3"
                opacity="0.14"
              />
              <g stroke="#1B1A17" stroke-width="11" stroke-linecap="round" fill="none">
                <path d="M30 46 v-8 a8 8 0 0 1 8 -8 h8" />
                <path d="M82 30 h8 a8 8 0 0 1 8 8 v8" />
                <path d="M98 82 v8 a8 8 0 0 1 -8 8 h-8" />
                <path d="M46 98 h-8 a8 8 0 0 1 -8 -8 v-8" />
              </g>
              <circle cx="64" cy="64" r="13" fill="#E8503A" />
            </svg>
          </span>
          <span class="brand-name">OpenScreenShot</span>
        </div>
        <button class="icon-btn" title="Settings">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </header>

      <nav class="modes">
        <button class="mode-card">
          <span class="mode-icon"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="6" y="3" width="12" height="18" rx="2" />
              <path d="M9 8h6M9 12h6M9 16h4" /></svg
          ></span>
          <span class="mode-text">
            <span class="mode-title">Full page</span>
            <span class="mode-sub">Scroll &amp; stitch the entire page</span>
          </span>
          <kbd>⌘⇧S</kbd>
        </button>
        <button class="mode-card">
          <span class="mode-icon"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" /></svg
          ></span>
          <span class="mode-text">
            <span class="mode-title">Visible area</span>
            <span class="mode-sub">Just what you see now</span>
          </span>
          <kbd>⌘⇧V</kbd>
        </button>
        <button class="mode-card">
          <span class="mode-icon"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="4" y="5" width="16" height="14" rx="2" stroke-dasharray="4 3" /></svg
          ></span>
          <span class="mode-text">
            <span class="mode-title">Region</span>
            <span class="mode-sub">Drag to select an area</span>
          </span>
          <kbd>3</kbd>
        </button>
      </nav>

      <div class="divider"></div>

      <div class="footer-row">
        <button class="link-btn">Reopen last capture</button>
        <button class="link-btn">Customize shortcuts</button>
      </div>
    </div>
  </body>
</html>
