<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>shot 2 — full page</title>
    <link rel="stylesheet" href="poster.css" />
    <style>
      /* Tall stitched-page strip on the left, text and result on the right. */
      .strip {
        position: absolute;
        left: 36px;
        top: -24px;
        width: 232px;
        height: 620px;
      }
      .strip .ui-frame {
        inset: 0;
        border-radius: 10px;
      }
      .seam {
        position: absolute;
        left: -8px;
        right: -8px;
        border-top: 2px dashed #d43f29;
        opacity: 0.75;
      }
      .seam .tag {
        position: absolute;
        right: 16px;
        top: -11px;
        background: #d43f29;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        border-radius: 999px;
        padding: 3px 9px;
      }
      .copy {
        position: absolute;
        left: 330px;
        top: 44px;
        width: 380px;
      }
      .copy h1 {
        font-size: 33px;
      }
      .result {
        position: absolute;
        left: 330px;
        right: 26px;
        top: 268px;
        height: 262px;
      }
      .result .ui-frame {
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div class="poster" style="display: block">
      <div class="strip">
        <div class="ui-frame">
          <iframe
            src="sample-page.html"
            scrolling="no"
            style="width: 520px; height: 1460px; transform: scale(0.4462); margin-top: -34px"
          ></iframe>
        </div>
        <div class="seam" style="top: 208px"><span class="tag">stitch</span></div>
        <div class="seam" style="top: 412px"><span class="tag">stitch</span></div>
      </div>

      <div class="copy">
        <div class="wordmark">
          <img src="brand-mark.svg" width="26" height="26" alt="" />
          OpenScreenShot
        </div>
        <h1>Capture the <span class="coral">whole page</span>. Not just the viewport.</h1>
        <p class="sub">
          Full-page, visible-area, and region screenshots from one popup — one click, or one
          shortcut. Long pages scroll &amp; stitch automatically.
        </p>
      </div>

      <div class="result">
        <div class="ui-frame">
          <div class="browser-top">
            <span class="dots"><i></i><i></i><i></i></span>
            <span class="urlbar">thecoastalalmanac.com</span>
          </div>
          <iframe
            src="sample-page.html"
            scrolling="no"
            style="width: 860px; height: 780px; transform: scale(0.63)"
          ></iframe>
        </div>
        <div class="badge-note" style="right: 14px; bottom: -14px">
          <span class="dot"></span> One click · entire scrolling page
        </div>
      </div>
    </div>
  </body>
</html>
