<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>shot 2 — region capture</title>
    <link rel="stylesheet" href="poster-site.css" />
    <style>
      /* A region selection in progress. The overlay mirrors what
         src/content/region-select.ts draws: a 40% mask, a dashed black
         border with a white halo, four round corner handles, the live W×H
         readout, and the Capture / Cancel bar. */
      .window {
        left: 80px;
        right: 80px;
        top: 64px;
        height: 700px;
      }
      .window-body {
        height: 656px;
      }
      .window-body iframe {
        width: 1040px;
        height: 1000px;
      }
      .sel {
        position: absolute;
        left: 548px;
        top: 108px;
        width: 420px;
        height: 300px;
        border: 2px dashed #000;
        outline: 1px solid #fff;
        outline-offset: 1px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
      }
      .sel .h {
        position: absolute;
        width: 13px;
        height: 13px;
        background: #fff;
        border: 2px solid #000;
        border-radius: 50%;
      }
      .sel .readout {
        position: absolute;
        left: 0;
        top: -30px;
        background: rgba(17, 17, 17, 0.85);
        color: #fff;
        font:
          600 12px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        padding: 3px 7px;
        border-radius: 5px;
        white-space: nowrap;
      }
      .sel .bar {
        position: absolute;
        right: 0;
        bottom: -46px;
        display: flex;
        gap: 6px;
        align-items: center;
        background: rgba(17, 17, 17, 0.92);
        padding: 5px;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        font:
          600 12px/1 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .sel .bar b {
        border-radius: 5px;
        padding: 6px 12px;
        background: #f8846f;
        color: #1c1c1e;
      }
      .sel .bar span {
        padding: 6px 10px;
        color: #cfcfcf;
      }
    </style>
  </head>
  <body>
    <div class="ground"></div>
    <div class="window">
      <div class="window-top">
        <span class="lights"><i></i><i></i><i></i></span>
        <span class="urlbar">opentechcheck.com</span>
        <span class="ext-icon"><img src="brand-mark.svg" width="20" height="20" alt="" /></span>
      </div>
      <div class="window-body">
        <iframe src="sample-page.html" scrolling="no"></iframe>
        <div class="sel">
          <span class="h" style="left: -7px; top: -7px"></span>
          <span class="h" style="right: -7px; top: -7px"></span>
          <span class="h" style="left: -7px; bottom: -7px"></span>
          <span class="h" style="right: -7px; bottom: -7px"></span>
          <span class="readout">420 × 300</span>
          <span class="bar"><b>Capture</b><span>Cancel</span></span>
        </div>
      </div>
    </div>
  </body>
</html>
