<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>shot 5 — the recorder</title>
    <link rel="stylesheet" href="poster.css" />
    <style>
      /* The real recorder editor (recorder.png), timeline and all: the
         capture is 1280x800 and the window shows it whole, so the
         auto-zoom blocks at the bottom stay in the picture. */
      .window {
        left: 60px;
        right: 60px;
        top: 34px;
        height: 560px;
      }
      .window-body img {
        width: 1280px;
        height: 800px;
        transform: scale(0.609375);
      }
    </style>
  </head>
  <body>
    <div class="ground mirror"></div>
    <div class="window">
      <div class="window-top">
        <span class="lights"><i></i><i></i><i></i></span>
        <span class="urlbar">OpenScreenShot — Recorder</span>
        <span class="ext-icon"><img src="brand-mark.svg" width="20" height="20" alt="" /></span>
      </div>
      <div class="window-body">
        <img src="captures/recorder.png" alt="" />
      </div>
    </div>
  </body>
</html>
