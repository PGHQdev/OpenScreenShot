<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <title>editor UI</title>
    <link rel="stylesheet" href="../../src/editor/editor.css" />
    <style>
      /* Static recreation: fixed frame, no live canvas. */
      html,
      body,
      #app,
      .editor {
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      .stage-fake {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .stage-fake iframe {
        position: absolute;
        top: 26px;
        left: 50%;
        width: 900px;
        height: 1900px;
        border: 0;
        background: #fffdf8;
        transform: translateX(-50%) scale(0.72);
        transform-origin: top center;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.14);
      }
      .ann {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="editor">
        <header class="topbar">
          <div class="topbar-brand">
            <span class="brand-mark">
              <svg width="22" height="22" viewBox="0 0 128 128">
                <rect x="6" y="6" width="116" height="116" rx="30" fill="#FAFAF7" />
                <rect
                  x="7.5"
                  y="7.5"
                  width="113"
                  height="113"
                  rx="28.5"
                  fill="none"
                  stroke="#1B1A17"
                  stroke-width="3"
                  opacity="0.14"
                />
                <g stroke="#1B1A17" stroke-width="11" stroke-linecap="round" fill="none">
                  <path d="M30 46 v-8 a8 8 0 0 1 8 -8 h8" />
                  <path d="M82 30 h8 a8 8 0 0 1 8 8 v8" />
                  <path d="M98 82 v8 a8 8 0 0 1 -8 8 h-8" />
                  <path d="M46 98 h-8 a8 8 0 0 1 -8 -8 v-8" />
                </g>
                <circle cx="64" cy="64" r="13" fill="#E8503A" />
              </svg>
            </span>
            <span class="brand-name">OpenScreenShot</span>
            <span class="brand-mode">Full Page</span>
          </div>
          <div class="topbar-controls">
            <div class="zoom-group">
              <button class="icon-btn">−</button>
              <span class="zoom-readout">72%</span>
              <button class="icon-btn">+</button>
              <button class="text-btn">Fit</button>
              <button class="text-btn">100%</button>
            </div>
            <button class="btn-secondary">Copy</button>
            <button class="btn-primary">Export</button>
          </div>
        </header>

        <div class="stylebar">
          <div class="stylebar-group">
            <span class="stylebar-label">Color</span>
            <div class="swatches">
              <button class="swatch" aria-pressed="true" style="background: #ff3b30"></button>
              <button class="swatch" style="background: #ff9500"></button>
              <button class="swatch" style="background: #ffcc00"></button>
              <button class="swatch" style="background: #34c759"></button>
              <button class="swatch" style="background: #0071e3"></button>
              <button class="swatch" style="background: #af52de"></button>
              <button class="swatch" data-light="1" style="background: #ffffff"></button>
              <button class="swatch" style="background: #1d1d1f"></button>
            </div>
          </div>
          <div class="stylebar-group">
            <span class="stylebar-label">Stroke</span>
            <div class="widths">
              <button class="width-btn"><span class="width-bar" style="height: 3px"></span></button>
              <button class="width-btn" aria-pressed="true">
                <span class="width-bar" style="height: 6px"></span>
              </button>
              <button class="width-btn"><span class="width-bar" style="height: 8px"></span></button>
            </div>
          </div>
          <div class="stylebar-group">
            <span class="stylebar-label">Size · 28px</span>
            <input class="range stylebar-range" type="range" min="12" max="96" value="28" />
          </div>
        </div>

        <div class="workspace">
          <aside class="toolbar">
            <button class="tool-btn" title="Select (V)">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 4l6 16 2-7 7-2z" />
              </svg>
            </button>
            <button class="tool-btn" title="Rectangle (R)">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="4" y="6" width="16" height="12" rx="2" />
              </svg>
            </button>
            <button class="tool-btn" title="Arrow (A)">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 20L20 4M20 4h-6M20 4v6" />
              </svg>
            </button>
            <button class="tool-btn" title="Pen (P)">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M16.5 3.5l4 4L7 21H3v-4z" />
              </svg>
            </button>
            <button class="tool-btn" title="Highlighter (H)">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m9 11-6 6v3h9l3-3" />
                <path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4l8 8Z" />
              </svg>
            </button>
            <button class="tool-btn" title="Text (T)">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 5h14M12 5v14M9 19h6" />
              </svg>
            </button>
            <button class="tool-btn is-active" title="Step number (S)">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="M10.5 9.6L12.2 8.2v7.6" />
              </svg>
            </button>
            <button class="tool-btn" title="Blur (B)">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="7" stroke-dasharray="2 3" />
              </svg>
            </button>
            <button class="tool-btn" title="Crop (C)">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M6 2v14h14M2 6h14v14" />
              </svg>
            </button>
            <div class="toolbar-divider"></div>
            <button class="tool-btn" title="Undo">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3" />
              </svg>
            </button>
            <button class="tool-btn" title="Redo" disabled>
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M15 14l5-5-5-5M20 9H9a5 5 0 0 0 0 10h3" />
              </svg>
            </button>
            <div class="toolbar-divider"></div>
            <button class="tool-btn tool-btn-danger" title="Delete" disabled>
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" />
              </svg>
            </button>
            <div class="toolbar-count">5</div>
          </aside>

          <div class="stage">
            <div class="stage-fake">
              <iframe src="sample-page.html" scrolling="no"></iframe>
              <svg class="ann" viewBox="0 0 1232 720">
                <!-- highlighter stroke over the standfirst line -->
                <rect
                  x="428"
                  y="248"
                  width="380"
                  height="22"
                  rx="11"
                  fill="#ffcc00"
                  opacity="0.45"
                />
                <!-- rect around the blockquote -->
                <rect
                  x="404"
                  y="384"
                  width="428"
                  height="86"
                  rx="6"
                  fill="none"
                  stroke="#ff3b30"
                  stroke-width="4"
                />
                <!-- arrow pointing at the headline -->
                <g stroke="#ff3b30" stroke-width="5" fill="#ff3b30" stroke-linecap="round">
                  <path d="M310 118 L416 158" fill="none" />
                  <path d="M416 158 l-26 -4 18 -18 z" stroke="none" />
                </g>
                <!-- step badges -->
                <g font-family="-apple-system, 'Segoe UI', sans-serif" font-weight="700">
                  <circle
                    cx="392"
                    cy="140"
                    r="19"
                    fill="#e8503a"
                    stroke="#fff"
                    stroke-width="2.5"
                  />
                  <text x="392" y="147" font-size="21" fill="#fff" text-anchor="middle">1</text>
                  <circle
                    cx="392"
                    cy="260"
                    r="19"
                    fill="#e8503a"
                    stroke="#fff"
                    stroke-width="2.5"
                  />
                  <text x="392" y="267" font-size="21" fill="#fff" text-anchor="middle">2</text>
                  <circle
                    cx="392"
                    cy="428"
                    r="19"
                    fill="#e8503a"
                    stroke="#fff"
                    stroke-width="2.5"
                  />
                  <text x="392" y="435" font-size="21" fill="#fff" text-anchor="middle">3</text>
                </g>
              </svg>
            </div>
          </div>
        </div>

        <footer class="statusbar">
          <span>1440 × 3184px</span>
          <span class="status-sep">·</span>
          <span>72%</span>
          <span class="status-spacer"></span>
          <span class="status-hint">Click to place a numbered badge · numbers stay in order</span>
        </footer>

        <div class="modal-backdrop" id="export" style="display: none">
          <div class="modal">
            <h2 class="modal-title">Export</h2>
            <div class="field-label">Format</div>
            <div class="format-grid">
              <button class="format-card">
                <span class="format-name">PNG</span>
                <span class="format-hint">Lossless · transparency</span>
              </button>
              <button class="format-card">
                <span class="format-name">JPEG</span>
                <span class="format-hint">Small · photos</span>
              </button>
              <button class="format-card">
                <span class="format-name">WebP</span>
                <span class="format-hint">Modern · efficient</span>
              </button>
              <button class="format-card is-selected">
                <span class="format-name">PDF</span>
                <span class="format-hint">Document · multi-page</span>
              </button>
            </div>
            <div class="modal-row">
              <div class="field-label">Page size</div>
              <div class="segmented">
                <button class="segmented-btn is-selected">A4</button>
                <button class="segmented-btn">Letter</button>
                <button class="segmented-btn">Full</button>
              </div>
            </div>
            <div class="modal-row">
              <div class="field-label">Orientation</div>
              <div class="segmented">
                <button class="segmented-btn is-selected">Portrait</button>
                <button class="segmented-btn">Landscape</button>
              </div>
            </div>
            <div class="modal-row check-row">
              <label class="check-label">
                <input type="checkbox" class="switch" checked />
                Split across multiple pages
              </label>
              <label class="check-label">
                Margin
                <input class="num-input" type="number" value="8" />
                mm
              </label>
            </div>
            <div class="modal-row">
              <label class="field-label">Filename</label>
              <div class="filename-row">
                <input class="filename-input" type="text" value="coastal-almanac_2026-08-10" />
                <span class="filename-ext">.pdf</span>
              </div>
            </div>
            <div class="modal-actions">
              <button class="text-btn">Cancel</button>
              <button class="btn-primary">Export</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      if (location.search.includes('export=1')) {
        document.getElementById('export').style.display = 'flex';
      }
    </script>
  </body>
</html>
