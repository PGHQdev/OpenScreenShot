<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>shot 3 — the editor</title>
    <link rel="stylesheet" href="poster.css" />
    <style>
      /* The real editor capture (1280x800 at 2x) in the window, scaled to the
         window's width; the bottom of the editor runs off the frame. */
      .window {
        left: 60px;
        right: 60px;
        top: 56px;
        height: 560px;
      }
      .window-body img {
        width: 1280px;
        height: 800px;
        transform: scale(0.609375);
      }
    </style>
  </head>
  <body>
    <div class="ground mirror"></div>
    <div class="window">
      <div class="window-top">
        <span class="lights"><i></i><i></i><i></i></span>
        <span class="urlbar">OpenScreenShot — Editor</span>
        <span class="ext-icon"><img src="brand-mark.svg" width="20" height="20" alt="" /></span>
      </div>
      <div class="window-body">
        <img src="captures/editor.png" alt="" />
      </div>
    </div>
  </body>
</html>
