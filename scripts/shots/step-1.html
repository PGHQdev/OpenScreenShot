<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>step 1 — capture</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 560px;
        height: 420px;
        overflow: hidden;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #f2f0ea;
        position: relative;
      }
      .region-hint {
        position: absolute;
        left: 44px;
        top: 52px;
        width: 472px;
        height: 330px;
        border: 2px dashed rgba(232, 80, 58, 0.5);
        border-radius: 10px;
      }
      .popup-frame {
        position: absolute;
        left: 93px;
        top: 32px;
        width: 374px;
        height: 469px;
        border-radius: 18px;
        overflow: hidden;
        background: #fff;
        border: 1px solid #dcd7cb;
        box-shadow:
          0 2px 6px rgba(27, 26, 23, 0.06),
          0 28px 56px -20px rgba(27, 26, 23, 0.35);
      }
      .popup-frame iframe {
        border: 0;
        display: block;
        width: 340px;
        height: 426px;
        transform: scale(1.1);
        transform-origin: top left;
      }
    </style>
  </head>
  <body>
    <div class="region-hint"></div>
    <div class="popup-frame">
      <iframe src="popup-ui.html" scrolling="no"></iframe>
    </div>
  </body>
</html>
