<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>marquee promo — 1400x560</title>
    <link rel="stylesheet" href="poster.css" />
    <style>
      html,
      body {
        width: 1400px;
        height: 560px;
      }
      .marquee {
        position: absolute;
        inset: 0;
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 50%;
        transform: translateY(-50%);
        width: 520px;
      }
      .copy .wordmark {
        font-size: 19px;
        margin-bottom: 28px;
      }
      .copy h1 {
        font-size: 58px;
        margin-bottom: 20px;
      }
      .copy .sub {
        font-size: 19px;
        margin-bottom: 26px;
        max-width: 480px;
      }
      .copy .chips {
        margin-top: 0;
        padding-top: 0;
      }
      .copy .chip {
        font-size: 14px;
        padding: 7px 15px;
      }
      .copy .chip .dot {
        width: 8px;
        height: 8px;
      }
      .stage {
        position: absolute;
        left: 660px;
        top: 61px;
        right: 40px;
        height: 438px;
      }
      .stage .ui-frame {
        inset: 0;
        border-radius: 18px;
      }
      /* capture-bracket corners echoing the icon */
      .corner {
        position: absolute;
        width: 52px;
        height: 52px;
        border: 6px solid #d43f29;
        opacity: 0.9;
      }
      .corner.tl {
        top: 30px;
        left: 30px;
        border-right: 0;
        border-bottom: 0;
        border-radius: 10px 0 0 0;
      }
      .corner.bl {
        bottom: 30px;
        left: 30px;
        border-right: 0;
        border-top: 0;
        border-radius: 0 0 0 10px;
        border-color: #f5a623;
      }
    </style>
  </head>
  <body>
    <div class="marquee">
      <span class="corner tl"></span>
      <span class="corner bl"></span>
      <div class="copy">
        <div class="wordmark">
          <img src="brand-mark.svg" width="34" height="34" alt="" />
          OpenScreenShot
        </div>
        <h1>
          <span class="coral">Full page</span> screenshot &amp;
          <span class="amber">annotate</span>
        </h1>
        <p class="sub">
          Capture the entire scrolling page, mark it up, and export as PNG, JPEG, WebP, or PDF — all
          on your device.
        </p>
        <div class="chips">
          <span class="chip"><span class="dot"></span>Free</span>
          <span class="chip"><span class="dot"></span>Open source</span>
          <span class="chip"><span class="dot"></span>100% private</span>
        </div>
      </div>

      <div class="stage">
        <div class="ui-frame">
          <iframe
            src="editor-ui.html"
            scrolling="no"
            style="width: 1280px; height: 800px; transform: scale(0.5469)"
          ></iframe>
        </div>
      </div>
    </div>
  </body>
</html>
