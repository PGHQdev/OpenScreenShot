<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>marquee promo — 1400x560</title>
    <link rel="stylesheet" href="poster.css" />
    <style>
      html,
      body {
        width: 1400px;
        height: 560px;
      }
      .copy {
        position: absolute;
        left: 80px;
        top: 50%;
        transform: translateY(-50%);
        width: 540px;
      }
      .copy .wordmark {
        font-size: 19px;
        margin-bottom: 30px;
      }
      .copy h1 {
        font-size: 56px;
        margin-bottom: 20px;
      }
      .copy .sub {
        font-size: 18px;
        margin-bottom: 26px;
        max-width: 480px;
      }
      .copy .chip {
        font-size: 14px;
        padding: 7px 15px;
      }
      .window {
        left: 700px;
        top: 70px;
        width: 780px;
        height: 560px;
      }
      .window-body img {
        width: 1280px;
        height: 800px;
        transform: scale(0.609375);
      }
    </style>
  </head>
  <body>
    <div class="ground"></div>
    <div class="copy">
      <div class="wordmark">
        <img src="brand-mark.svg" width="34" height="34" alt="" />
        OpenScreenShot
      </div>
      <h1>Full page screenshots. <span class="muted">Nothing leaves your machine.</span></h1>
      <p class="sub">
        Capture the whole page, draw on it, and export PNG, JPEG, WebP or PDF. Record the tab when a
        still image is not enough.
      </p>
      <div class="chips">
        <span class="chip"><span class="dot"></span>Free</span>
        <span class="chip"><span class="dot"></span>Open source</span>
        <span class="chip"><span class="dot"></span>No account</span>
        <span class="chip"><span class="dot"></span>No upload</span>
      </div>
    </div>
    <div class="window">
      <div class="window-top">
        <span class="lights"><i></i><i></i><i></i></span>
        <span class="urlbar">OpenScreenShot — Editor</span>
      </div>
      <div class="window-body">
        <img src="captures/editor.png" alt="" />
      </div>
    </div>
  </body>
</html>
