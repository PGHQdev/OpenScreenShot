<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>promo tile — 440x280</title>
    <link rel="stylesheet" href="poster.css" />
    <style>
      html,
      body {
        width: 440px;
        height: 280px;
      }
      .copy {
        position: absolute;
        left: 30px;
        top: 50%;
        transform: translateY(-50%);
        width: 250px;
      }
      .copy .wordmark {
        font-size: 13px;
        margin-bottom: 14px;
      }
      .copy .wordmark img {
        width: 22px;
        height: 22px;
      }
      .copy h1 {
        font-size: 26px;
        margin-bottom: 10px;
      }
      .copy .sub {
        font-size: 12px;
        max-width: 230px;
      }
      /* the popup, cut mid-card by the tile's edge */
      .popup {
        left: 300px;
        top: 34px;
        border-radius: 12px;
      }
      .popup img {
        width: 260px;
      }
    </style>
  </head>
  <body>
    <div class="ground"></div>
    <div class="copy">
      <div class="wordmark">
        <img src="brand-mark.svg" width="22" height="22" alt="" />
        OpenScreenShot
      </div>
      <h1>{{promoTitle}} <span class="muted">{{promoTitleMuted}}</span></h1>
      <p class="sub">{{promoSub}}</p>
    </div>
    <div class="popup">
      <img src="captures/popup.png" alt="" />
    </div>
  </body>
</html>
