<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>shot 1 — hero</title>
    <link rel="stylesheet" href="poster.css" />
    <style>
      /* Full-bleed hero: headline band on top, editor filling the rest. */
      .band {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 26px 34px 20px;
      }
      .band h1 {
        font-size: 28px;
        margin-bottom: 0;
        white-space: nowrap;
      }
      .band .chips {
        margin-top: 0;
        padding-top: 0;
        margin-left: auto;
        flex-wrap: nowrap;
      }
      .hero-stage {
        position: absolute;
        left: 34px;
        right: 34px;
        top: 96px;
        bottom: -18px;
      }
    </style>
  </head>
  <body>
    <div class="poster" style="display: block">
      <div class="band">
        <h1>
          <span class="coral">Full page screenshot</span> &amp;
          <span class="amber">annotation</span> for Chrome
        </h1>
        <div class="chips">
          <span class="chip"><span class="dot"></span>Open source</span>
          <span class="chip"><span class="dot"></span>100% private</span>
        </div>
      </div>

      <div class="hero-stage">
        <div class="ui-frame" style="left: 0; top: 0; right: 0; bottom: 0">
          <iframe
            src="editor-ui.html"
            scrolling="no"
            style="width: 1280px; height: 800px; transform: scale(0.6516)"
          ></iframe>
        </div>
        <div class="badge-note" style="right: 22px; top: 383px">
          <span class="dot"></span> Capture · Annotate · Export — all on your device
        </div>
      </div>
    </div>
  </body>
</html>
