<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>store — popup over the page</title>
    <link rel="stylesheet" href="poster.css" />
    <style>
      /* The Chrome Web Store popup screenshot: the real popup capture, at its
         natural size, dropped over the sample page the way Chrome opens it —
         top right, under the toolbar. Full bleed at 1280x800, since the store
         frame is the browser. */
      html,
      body {
        width: 1280px;
        height: 800px;
      }
      .window {
        inset: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .window-top {
        height: 48px;
        padding: 0 18px;
      }
      .urlbar {
        height: 31px;
        max-width: 600px;
        font-size: 13px;
      }
      .window-body {
        height: 752px;
      }
      .window-body iframe {
        width: 1280px;
        height: 1000px;
      }
      .popup {
        right: 20px;
        top: 54px;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="window-top">
        <span class="lights"><i></i><i></i><i></i></span>
        <span class="urlbar">
          <svg
            width="11"
            height="11"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <rect x="4" y="11" width="16" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
          opentechcheck.com
        </span>
        <span class="ext-icon"><img src="brand-mark.svg" width="20" height="20" alt="" /></span>
      </div>
      <div class="window-body">
        <iframe src="sample-page.html" scrolling="no"></iframe>
      </div>
    </div>
    <div class="popup">
      <img src="captures/popup.png" alt="" />
    </div>
  </body>
</html>
