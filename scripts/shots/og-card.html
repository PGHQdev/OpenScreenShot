<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>og card — 1200x630</title>
    <link rel="stylesheet" href="poster.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 50%;
        transform: translateY(-50%);
        width: 470px;
      }
      .copy .wordmark {
        font-size: 18px;
        margin-bottom: 30px;
      }
      .copy h1 {
        font-size: 52px;
        margin-bottom: 18px;
      }
      .copy .sub {
        font-size: 17px;
        margin-bottom: 26px;
        max-width: 430px;
      }
      .copy .chip {
        font-size: 13px;
        padding: 6px 13px;
      }
      /* the editor, running off the right and bottom edges */
      .window {
        left: 600px;
        top: 96px;
        width: 720px;
        height: 600px;
      }
      .window-body img {
        width: 1280px;
        height: 800px;
        transform: scale(0.5625);
      }
    </style>
  </head>
  <body>
    <div class="ground"></div>
    <div class="copy">
      <div class="wordmark">
        <img src="brand-mark.svg" width="30" height="30" alt="" />
        OpenScreenShot
      </div>
      <h1>
        Full page screenshots for Chrome. <span class="muted">Nothing leaves your machine.</span>
      </h1>
      <p class="sub">
        Capture the whole page, draw on it, and export PNG, JPEG, WebP or PDF. Record the tab when a
        still image is not enough.
      </p>
      <div class="chips">
        <span class="chip"><span class="dot"></span>Free</span>
        <span class="chip"><span class="dot"></span>Open source</span>
        <span class="chip"><span class="dot"></span>No account</span>
        <span class="chip"><span class="dot"></span>No upload</span>
      </div>
    </div>
    <div class="window">
      <div class="window-top">
        <span class="lights"><i></i><i></i><i></i></span>
        <span class="urlbar">OpenScreenShot — Editor</span>
      </div>
      <div class="window-body">
        <img src="captures/editor.png" alt="" />
      </div>
    </div>
  </body>
</html>
