<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenScreenShot</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main aria-live="polite">
      <div class="heading">
        <span id="check" hidden aria-hidden="true">✓</span><strong id="status"></strong
        ><span id="percent"></span>
      </div>
      <p id="detail" hidden><span id="hint"></span> <button id="retry" hidden></button></p>
      <progress id="progress" max="100" value="0"></progress>
      <button id="open" hidden></button>
      <div id="quick" role="group" hidden>
        <button id="copy"></button>
        <button id="png"></button>
        <button id="pdf"></button>
      </div>
      <button id="settings" hidden></button>
    </main>
  </body>
</html>
