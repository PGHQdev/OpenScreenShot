name: Release

on:
  push:
    tags:
      - 'v*' # v0.1.0, v0.2.0, etc.

jobs:
  # A release tagged while the previous submission is still in review would
  # do a full build and then die at the Chrome Web Store upload step. This
  # asks the store first (API v2 fetchStatus: submittedItemRevisionStatus is
  # PENDING_REVIEW while a version sits in the queue) and fails fast with a
  # clear message instead. If the check itself cannot run — missing
  # CWS_PUBLISHER_ID, expired token, API change — it warns and lets the
  # release proceed: that is the status quo, a late failure at the upload
  # step, which must stay possible so a broken gate never blocks releases.
  review-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a version already in review
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: hdabbojjccojlapnfjpdppcpfcnhgmdp
        run: |
          if [ -z "$PUBLISHER_ID" ]; then
            echo "::warning::CWS_PUBLISHER_ID secret is not set; skipping the review-status check."
            exit 0
          fi

          TOKEN=$(curl -sf https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::warning::Could not get a Chrome Web Store access token; skipping the review-status check."
            exit 0
          fi

          STATE=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:fetchStatus" \
            | jq -r '.submittedItemRevisionStatus.state // empty') || {
            echo "::warning::fetchStatus request failed; skipping the review-status check."
            exit 0
          }

          echo "Submitted revision state: ${STATE:-none}"
          if [ "$STATE" = "PENDING_REVIEW" ]; then
            echo "::error::A version is already in review on the Chrome Web Store. Re-run this workflow after the review completes."
            exit 1
          fi

  build:
    needs: review-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create a GitHub release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Generate icons
        run: npm run icons

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build & package
        run: npm run package

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: openscreenshot-v${{ env.VERSION }}.zip
          extension-id: hdabbojjccojlapnfjpdppcpfcnhgmdp
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenScreenShot ${{ github.ref_name }}
          body: |
            **OpenScreenShot ${{ github.ref_name }}**

            [Install from the Chrome Web Store](https://chromewebstore.google.com/detail/hdabbojjccojlapnfjpdppcpfcnhgmdp)

            ### Changelog
            See the commit log for details.
          files: openscreenshot-*.zip
          generate_release_notes: true
